<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<div th:replace="~{fragments/header}"></div>




</head>
<body>
	<!-- .app -->
	<div class="app">
		<!--[if lt IE 10]>
      <div class="page-message" role="alert">You are using an <strong>outdated</strong> browser. Please <a class="alert-link" href="http://browsehappy.com/">upgrade your browser</a> to improve your experience and security.</div>
      <![endif]-->


		<div th:replace="~{fragments/app_header}"></div>

		<div th:replace="~{fragments/sidebar}"></div>

		<!-- .app-main -->
		<main class="app-main">
			<!-- .wrapper -->
			<div class="wrapper">
				<!-- .page -->
				<div class="page">
					<!-- .page-inner -->
					<div class="page-inner">
						<!-- .page-title-bar -->
						<header class="page-title-bar"> </header>
						<!-- /.page-title-bar -->

							<div class="page-section">

								<!-- .page-section -->

								<div class="d-flex align-items-center justify-content-between flex-wrap"
									style="margin: 20px 20px 15px 20px">
									<span class="h5 m-0 font-weight-bold text-primary">SENSOR</span>
									<a th:href="@{/ss/home}" class="btn btn-sm btn-secondary">
										<i class="fas fa-arrow-left"></i>&nbsp;Sensors
									</a>
								</div>

							     <div class="card shadow mb-4">
							          <div class="card-header py-3">
							             <span class="h6 m-0 font-weight-bold text-primary">SENSOR&nbsp;&nbsp;&nbsp;&nbsp;<a href="javascript:newObj()" role="button" class="btn btn-sm btn-icon btn-secondary" ><i class="fas fa-plus"></i></a></span>  	
						          </div>
						         <div class="card-body">
								      <table class="table table-hover table-sm" id="results" style="width: 100%">
								    	<thead>
								    		<tr>
								    			<th></th>
								    			<th>EQUIPMENT</th>
								    			<th>DESCRIPTION</th>
								    			<th>Poll Controller</th>
								    		</tr>
								    	</thead>
								    	<tbody>
								    	
								    	
								    	</tbody>
						
								    </table>
							    </div>
							</div>
							
							
							
							<!--  ************************ Body Content End / Start Modals *************************************************** -->
		

			<!-- Form Modal-->
			<div class="modal fade" id="formModal" tabindex="-1" role="dialog"
				aria-labelledby="exampleModalLabel" aria-hidden="true">
				<div class="modal-dialog" role="document">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="exampleModalLabel">Sensor</h5>
							<button class="close" type="button" data-dismiss="modal"
								aria-label="Close">
								<span aria-hidden="true">&times;</span>
							</button>
						</div>
						<form>
								<div class="modal-body">
									<input type="hidden" id="form-sensor_id" name="sensor_id"/>
									<input type="hidden" id="form-external" name="external" value="N"/>
									<div class="form-group">
										<label for="name">Name</label> 
									<input type="text"
										class="form-control form-control-sm" id="form-name"
										placeholder="sensor name..." name="name">
								</div>
								<div class="form-group">
									<label for="description">Description</label>
									<textarea class="form-control"
										id="form-description" rows="3" placeholder="description..." name="description"></textarea>
								</div>
								<div class="form-group">
									<label for="description">Equipment</label>
									<select class="form-control form-control-sm"
										id="form-equipment_id" name="equipment_id">
									</select>
								</div>
								<div class="form-group">
									<label for="name">IP Address</label> 
									<input type="text"
										class="form-control form-control-sm" id="form-ip_address"
										placeholder="192.168.1.201..." name="ip_address">
								</div>
								<div class="form-group">
									<label for="name">IP Port</label> 
									<input type="text"
										class="form-control form-control-sm" id="form-port"
										placeholder="1000..." name="port">
								</div>
								<div class="form-group">
									<label for="description">Check Adapter</label>
									<select class="form-control form-control-sm"
										id="form-adapter" name="adapter">
										<option value="HTTPGET">HTTPGET</option>
									</select>
								</div>
								<div class="form-group">
									<label for="name">Check CMD Parameter(s)</label> 
									<input type="text"
										class="form-control form-control-sm" id="form-adapter_parameter"
										placeholder="*SRTF\\r" name="adapter_parameter">
								</div>
								<div class="form-group">
									<label for="name">Temperature Threshold (Fahrenheit)</label> 
									<input type="number" step="0.1"
										class="form-control form-control-sm" id="form-threshold_temp"
										placeholder="200" name="threshold_temp">
								</div>
								<div class="form-group">
									<label for="description">Active</label>
									<select class="form-control form-control-sm"
										id="form-active" name="active">
										<option value="N">No</option>
										<option value="Y">Yes</option>
									</select>
								</div>							
								
							</div>
							<div class="modal-footer">
								<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
								<button type="submit" class="btn btn-primary">Update</button>
							</div>
						</form>
					</div>
				</div>
			</div>
			
			
				<!-- DEL Confirmation Modal -->
				<div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="confirmModalLabel" aria-hidden="true">
				  <div class="modal-dialog" role="document">
				    <div class="modal-content">
				      <div class="modal-header">
				        <h5 class="modal-title" id="exampleModalLabel">DELETE</h5>
				        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
				          <span aria-hidden="true">&times;</span>
				        </button>
				      </div>
				      <div class="modal-body">
				        Do you want to delete this object?
				      </div>
				      <div class="modal-footer">
				        <button type="button" class="btn btn-secondary" data-dismiss="modal">NO</button>
				        	<a href="javascript:deleteID()" role="button" class="btn btn-danger">YES</a>
				      </div>
				    </div>
				  </div>
				</div>


					<!-- ****************  End Modals ******************* -->
		
							
							
							

						</div>
						<!-- /.page-section -->
					</div>
					<!-- /.page-inner -->
				</div>
				<!-- /.page -->
			</div>

			<div th:replace="~{fragments/footer}"></div>


			<!-- /.wrapper -->
		</main>
		<!-- /.app-main -->
	</div>
	<!-- /.app -->


	<!-- BEGIN BASE JS -->
	<script th:src="@{/assets/vendor/jquery/jquery.min.js}"></script>
	<script th:src="@{/assets/vendor/bootstrap/js/popper.min.js}"></script>
	<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.min.js}"></script>
	<!-- END BASE JS -->
	<!-- BEGIN PLUGINS JS -->
	<script th:src="@{/assets/vendor/pace/pace.min.js}"></script>
	<script th:src="@{/assets/vendor/stacked-menu/stacked-menu.min.js}"></script>
	<script th:src="@{/assets/vendor/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
	<script th:src="@{/assets/vendor/flatpickr/flatpickr.min.js}"></script>

	<!-- BEGIN THEME JS -->
	<script th:src="@{/assets/javascript/theme.min.js}"></script>
	<!-- END THEME JS -->

	<!-- Page level plugins -->
	<script th:src="@{/assets/vendor/datatables/jquery.dataTables.min.js}"></script>
	<script
		th:src="@{/assets/vendor/datatables/dataTables.bootstrap4.min.js}"></script>



	<script>
    
	var table;
	  
    $(document).ready(function() {
        table = $('#results').DataTable( {
        	"ajax": { 
        		"url" : "/ss/sensor/json",
        		"dataSrc" : ""
            },
        	 "columns" : [
        		 { "data" : "sensor_id",
        			 render : function ( data, type, full, meta) {
        				 return "<a href='javascript:fetchID(\"" + data + "\")' role=\"button\" class=\"btn btn-sm btn-icon btn-secondary\"'><i class='far fa-edit'></i></a>"; 
        			 }},
        		 { "data" : "name",
        			  render : function ( data, type, full, meta) {
        				  return data + "&nbsp;" + ( full.active == "N" ? "<span class='small-tag'>INACTIVE</span>" : "")
        			  }},
        		 { "data" : "equipment_id" }
        		 
        	 ]
        });
    } );
	    
    
	function fetchID(id) {
		$.when(
			$.getJSON('/lkup/equipment/json'),
			$.getJSON('/ss/sensor/json/' + id)
		).done(function(equipmentResponse, sensorResponse) {
			var equipment = equipmentResponse[0];
			var sensor = sensorResponse[0];

			$('#form-equipment_id').empty();
			$.each(equipment, function(i, obj) {
				$('#form-equipment_id').append($('<option>').text(obj.value).attr('value', obj.id));
			});
			ensureAdapterOption(sensor.adapter);

			$('#form-name').val(sensor.name);
			$('#form-sensor_id').val(sensor.sensor_id);
			$('#form-description').val(sensor.description);
			$('#form-ip_address').val(sensor.ip_address);
			$('#form-equipment_id').val(sensor.equipment_id);
			$('#form-adapter').val(sensor.adapter || 'HTTPGET');
			$('#form-adapter_parameter').val(sensor.adapter_parameter || sensor.check_cmd || '');
			$('#form-threshold_temp').val(sensor.threshold_temp);
			$('#form-external').val(sensor.external);
			$('#form-active').val(sensor.active);
			$('#form-port').val(sensor.port);

			$('#formModal').modal('show');
		}).fail(function(xhr, ajaxOptions, thrownError) {
			alert(thrownError + "\r\n" + xhr.statusText + "\r\n" + xhr.responseText);
		});
	}

	function ensureAdapterOption(adapterValue) {
		if (!adapterValue) {
			return;
		}
		if ($('#form-adapter option[value="' + adapterValue + '"]').length === 0) {
			$('#form-adapter').append($('<option>').val(adapterValue).text(adapterValue));
		}
	}
	
	function newObj() {
		
		// Clear out some form vars
		$('#form-name').val("");
		$('#form-sensor_id').val("-1");
		$('#form-description').val("");
		$('#form-ip_address').val("");
		$('#form-adapter').val("HTTPGET");
		$('#form-adapter_parameter').val("");
		$('#form-threshold_temp').val("");
		$('#form-external').val("N");
		$('#form-active').val("Y");
		$('#form-port').val("0")

		$.getJSON('/lkup/equipment/json',
				function(data) {
			
					$('#form-equipment_id').empty();
		            $.each(data, function(i, obj){
		                    $('#form-equipment_id').append($('<option>').text(obj.value).attr('value', obj.id));
		            });
	
		});
					
		$('#formModal').modal('show');
		
		
	}

	
	$(function() {
		$('form').bind('submit', function(event) {

			event.preventDefault();// using this page stop being refreshing 

			$.ajax({
				type : 'POST',
				url : '/ss/sensor/update',
				data : $('form').serialize(),
				success : function(data) {

					// Clear out form vars
					$('#form-name').val("");
					$('#form-sensor_id').val("-1");
					$('#form-description').val("");
					$('#form-ip_address').val("");
					$('#form-adapter').val("HTTPGET");
					$('#form-adapter_parameter').val("");
					$('#form-threshold_temp').val("");
					$('#form-external').val("N");
					$('#form-active').val("Y");
					$('#form-port').val("0");

					$('#formModal').modal('hide');

					table.ajax.reload();

				},
				error: function(xhr, ajaxOptions, thrownError) {
	                  alert(thrownError + "\r\n" + xhr.statusText + "\r\n" + xhr.responseText);
	            }
			});

		});
	});
	
    
    </script>


</body>
</html>
