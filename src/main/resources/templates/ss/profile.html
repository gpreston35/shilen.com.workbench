<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<div th:replace="~{fragments/header}"></div>

</head>
<body>
	<div class="app">
		<div th:replace="~{fragments/app_header}"></div>
		<div th:replace="~{fragments/sidebar}"></div>

		<main class="app-main">
			<div class="wrapper">
				<div class="page">
					<div class="page-inner">
						<header class="page-title-bar"></header>

						<div class="page-section">
							<div class="d-flex align-items-center justify-content-between flex-wrap"
								style="margin: 20px 20px 15px 20px">
								<span class="h5 m-0 font-weight-bold text-primary">PROFILES</span>
								<a th:href="@{/ss/home}" class="btn btn-sm btn-secondary">
									<i class="fas fa-arrow-left"></i>&nbsp;Sensors
								</a>
							</div>

							<div class="card shadow mb-4">
								<div class="card-header py-3">
									<span class="h6 m-0 font-weight-bold text-primary">TEMPERATURE PROFILES&nbsp;&nbsp;&nbsp;&nbsp;
										<a href="javascript:newObj()" role="button" class="btn btn-sm btn-icon btn-secondary"><i class="fas fa-plus"></i></a>
									</span>
								</div>
								<div class="card-body">
									<table class="table table-hover table-sm" id="results" style="width: 100%">
										<thead>
											<tr>
												<th></th>
												<th>NAME</th>
												<th>DESCRIPTION</th>
											</tr>
										</thead>
										<tbody></tbody>
									</table>
								</div>
							</div>

							<div class="modal fade" id="formModal" tabindex="-1" role="dialog" aria-hidden="true">
								<div class="modal-dialog" role="document">
									<div class="modal-content">
										<div class="modal-header">
											<h5 class="modal-title">Profile Maintenance</h5>
											<button class="close" type="button" data-dismiss="modal" aria-label="Close">
												<span aria-hidden="true">&times;</span>
											</button>
										</div>
										<form id="profileForm">
											<div class="modal-body">
												<input type="hidden" id="form-profile_id" name="profile_id" />
												<div class="form-group">
													<label for="form-name">Name</label>
													<input type="text" class="form-control form-control-sm" id="form-name" name="name"
														placeholder="profile name..." required>
												</div>
												<div class="form-group">
													<label for="form-description">Description</label>
													<textarea class="form-control form-control-sm" id="form-description" name="description"
														rows="7" placeholder="description..."></textarea>
												</div>
											</div>
											<div class="modal-footer">
												<button type="button" class="btn btn-outline-danger mr-auto" id="deleteBtn">Delete</button>
												<button type="submit" class="btn btn-primary">Update</button>
											</div>
										</form>
									</div>
								</div>
							</div>

							<div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-hidden="true">
								<div class="modal-dialog" role="document">
									<div class="modal-content">
										<div class="modal-header">
											<h5 class="modal-title">DELETE</h5>
											<button type="button" class="close" data-dismiss="modal" aria-label="Close">
												<span aria-hidden="true">&times;</span>
											</button>
										</div>
										<div class="modal-body">
											Do you want to delete this profile?
										</div>
										<div class="modal-footer">
											<button type="button" class="btn btn-secondary" data-dismiss="modal">NO</button>
											<button type="button" class="btn btn-danger" id="confirmDeleteBtn">YES</button>
										</div>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>
			</div>

			<div th:replace="~{fragments/footer}"></div>
		</main>
	</div>

	<script th:src="@{/assets/vendor/jquery/jquery.min.js}"></script>
	<script th:src="@{/assets/vendor/bootstrap/js/popper.min.js}"></script>
	<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.min.js}"></script>
	<script th:src="@{/assets/vendor/pace/pace.min.js}"></script>
	<script th:src="@{/assets/vendor/stacked-menu/stacked-menu.min.js}"></script>
	<script th:src="@{/assets/vendor/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
	<script th:src="@{/assets/vendor/flatpickr/flatpickr.min.js}"></script>
	<script th:src="@{/assets/javascript/theme.min.js}"></script>
	<script th:src="@{/assets/vendor/datatables/jquery.dataTables.min.js}"></script>
	<script th:src="@{/assets/vendor/datatables/dataTables.bootstrap4.min.js}"></script>

	<script>
		var table;

		function clearForm() {
			$('#form-profile_id').val('-1');
			$('#form-name').val('');
			$('#form-description').val('');
		}

		function updateDeleteVisibility() {
			var isNew = $('#form-profile_id').val() === '-1';
			$('#deleteBtn').toggle(!isNew);
		}

		function fetchID(id) {
			$.getJSON('/ss/profile/json/' + id, function(data) {
				$('#form-profile_id').val(data.profile_id);
				$('#form-name').val(data.name || '');
				$('#form-description').val(data.description || '');
				updateDeleteVisibility();
				$('#formModal').modal('show');
			}).fail(function(xhr, ajaxOptions, thrownError) {
				alert(thrownError + "\r\n" + xhr.statusText + "\r\n" + xhr.responseText);
			});
		}

		function newObj() {
			clearForm();
			updateDeleteVisibility();
			$('#formModal').modal('show');
		}

		$(document).ready(function() {
			table = $('#results').DataTable({
				"ajax": {
					"url": "/ss/profile/json",
					"dataSrc": ""
				},
				"columns": [
					{
						"data": "profile_id",
						render: function(data) {
							return "<a href='javascript:fetchID(\"" + data + "\")' role=\"button\" class=\"btn btn-sm btn-icon btn-secondary\"><i class='far fa-edit'></i></a>";
						}
					},
					{ "data": "name" },
					{ "data": "description" }
				]
			});

			$('#profileForm').on('submit', function(event) {
				event.preventDefault();

				$.ajax({
					type: 'POST',
					url: '/ss/profile/update',
					data: $('#profileForm').serialize(),
					success: function() {
						$('#formModal').modal('hide');
						table.ajax.reload();
					},
					error: function(xhr, ajaxOptions, thrownError) {
						alert(thrownError + "\r\n" + xhr.statusText + "\r\n" + xhr.responseText);
					}
				});
			});

			$('#deleteBtn').on('click', function() {
				$('#confirmModal').modal('show');
			});

			$('#confirmDeleteBtn').on('click', function() {
				$.ajax({
					type: 'POST',
					url: '/ss/profile/delete',
					data: { profile_id: $('#form-profile_id').val() },
					success: function() {
						$('#confirmModal').modal('hide');
						$('#formModal').modal('hide');
						clearForm();
						table.ajax.reload();
					},
					error: function(xhr, ajaxOptions, thrownError) {
						alert(thrownError + "\r\n" + xhr.statusText + "\r\n" + xhr.responseText);
					}
				});
			});
		});
	</script>

</body>
</html>
