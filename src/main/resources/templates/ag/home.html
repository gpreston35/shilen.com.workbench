<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
<div th:replace="~{fragments/header}"></div>
</head>

<body>
	<div class="app">
		<div th:replace="~{fragments/app_header}"></div>
		<div th:replace="~{fragments/sidebar}"></div>

		<main class="app-main">
			<div class="wrapper">
				<div class="page">
					<div class="page-inner">
						<header class="page-title-bar"> </header>

						<div class="page-section">
							<div class="d-flex align-items-center justify-content-between flex-wrap"
								style="margin: 20px 20px 15px 20px">
								<span class="h5 m-0 font-weight-bold text-primary">AIR GAUGE</span>
							</div>

							<div class="card shadow mb-4" style="margin: 20px 20px 20px 20px">
								<div class="card-header py-3">
									<span class="h6 m-0 font-weight-bold text-primary">SEARCH</span>
								</div>
								<div class="card-body">
									<form id="searchForm" th:action="@{/ag/search}" th:object="${SEARCH_FORM}" method="post">
										<div class="form-row">
											<div class="col-md-4 mb-3">
												<label class="control-label" for="type">Search Type</label>
												<select id="type" name="type" th:field="*{type}" class="form-control form-control-sm">
													<option value="wo">Work Order</option>
													<option value="serial">Serial Number</option>
												</select>
											</div>
											<div class="col-md-6 mb-3">
												<label class="control-label" for="value">Search Value</label>
												<input type="text" class="form-control form-control-sm" id="value" name="value"
													th:field="*{value}" autofocus>
											</div>
											<div class="col-md-2 mb-3 d-flex align-items-end">
												<button type="submit" class="btn btn-primary btn-sm btn-block">Search</button>
											</div>
										</div>
									</form>
								</div>
							</div>

							<div class="card shadow mb-4" style="margin: 20px 20px 20px 20px">
								<div class="card-header py-3">
									<span class="h6 m-0 font-weight-bold text-primary">INSPECTION RUNS</span>
								</div>
								<div class="card-body">
									<div class="alert alert-info mb-0"
										th:if="${SEARCH_PERFORMED and #lists.isEmpty(INSPECTIONS)}">
										No Air Gauge inspections were found.
									</div>

									<table class="table table-hover table-sm" id="results" style="width: 100%;"
										th:if="${not #lists.isEmpty(INSPECTIONS)}">
										<thead>
											<tr>
												<th>Inspection</th>
												<th>Work Order</th>
												<th>Serial Number</th>
												<th>Created</th>
												<th>Custom 1</th>
												<th>Custom 2</th>
												<th>Comment</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="inspection : ${INSPECTIONS}">
												<td>
													<a th:href="@{/ag/inspection/{id}(id=${inspection.id},backType=${SEARCH_FORM.type},backValue=${SEARCH_FORM.value})}"
														class="btn btn-sm btn-secondary">
														View&nbsp;<span th:text="${inspection.id}"></span>
													</a>
												</td>
												<td th:text="${inspection.woid}"></td>
												<td th:text="${inspection.serialNumber}"></td>
												<td th:text="${inspection.created}"></td>
												<td th:text="${inspection.custom1}"></td>
												<td th:text="${inspection.custom2}"></td>
												<td th:text="${inspection.comment}"></td>
											</tr>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div th:replace="~{fragments/footer}"></div>
		</main>
	</div>

	<script th:src="@{/assets/vendor/jquery/jquery.min.js}" type="text/javascript"></script>
	<script th:src="@{/assets/vendor/bootstrap/js/popper.min.js}" type="text/javascript"></script>
	<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.min.js}" type="text/javascript"></script>
	<script th:src="@{/assets/vendor/pace/pace.min.js}" type="text/javascript"></script>
	<script th:src="@{/assets/vendor/stacked-menu/stacked-menu.min.js}" type="text/javascript"></script>
	<script th:src="@{/assets/vendor/perfect-scrollbar/perfect-scrollbar.min.js}" type="text/javascript"></script>
	<script th:src="@{/assets/javascript/theme.min.js}" type="text/javascript"></script>
	<script th:src="@{/assets/vendor/datatables/jquery.dataTables.min.js}" type="text/javascript"></script>
	<script th:src="@{/assets/vendor/datatables/dataTables.bootstrap4.min.js}" type="text/javascript"></script>

	<script type="text/javascript">
		$(document).ready(function() {
			if ($('#results').length) {
				$('#results').DataTable({
					lengthMenu: [50, 25, -1],
					order: [ [1, 'asc'], [2, 'asc'], [3, 'desc'] ]
				});
			}
		});
	</script>
</body>
</html>
