<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

<div th:replace="~{fragments/header}"></div>

</head>
<body>
	<!-- .app -->
	<div class="app">
		<!--[if lt IE 10]>
      <div class="page-message" role="alert">You are using an <strong>outdated</strong> browser. Please <a class="alert-link" href="http://browsehappy.com/">upgrade your browser</a> to improve your experience and security.</div>
      <![endif]-->


		<div th:replace="~{fragments/app_header}"></div>

		<div th:replace="~{fragments/sidebar}"></div>

		<!-- .app-main -->
		<main class="app-main">
			<!-- .wrapper -->
			<div class="wrapper">
				<!-- .page -->
				<div class="page">
					<!-- .page-inner -->
					<div class="page-inner">
						<!-- .page-title-bar -->
						<header class="page-title-bar"></header>
						<!-- /.page-title-bar -->

						<div class="page-section">

							<!-- .page-section -->
							

							<span class="h5 m-0 font-weight-bold text-primary">BORE REAMERS</span>

					
							
							<span sec:authorize="hasAnyAuthority('ADMIN', 'POWER_USER')">	
								<p><a type="button" class="btn btn-primary btn-sm" th:href="@{/tool/br/new}" style="margin-top: 10px;">&nbsp;&nbsp;Add&nbsp;&nbsp;</a>
							</span>
							


							<div class="card card-fluid" style="margin-top: 15px;">
								<div class="card-header"><span class="h6 m-0 font-weight-bold text-primary">SEARCH</span></div>
								<!-- /.card-header -->

								<div class="card-body">
									<!-- .table -->
									


									<form th:action="@{/tool/br/search}" th:object="${SEARCH_FORM}" method="post">

										<div class="form-row">
											<div class="col-md-6 mb-3">
												<label class="control-label" for="active">Active</label>
												<select name="active" th:field="*{active}" id="active"
													class="form-control form-control-sm">
													<option value=""></option>
													<option value="1">Yes</option>
													<option value="0">No</option>
												</select>
											</div>
											<div class="col-md-6 mb-3">
												<label class="control-label" for="search_term">Tool Identifier</label>
												<input type="text" class="form-control form-control-sm" id="search_term"
													th:field="*{search_term}" placeholder="ex BR0243">
											</div>
									    </div>

										<div class="form-row">
											<div class="col-md-4 mb-3">
												<label class="control-label" for="preset_id">Caliber</label>
												<select name="preset_id" th:field="*{preset_id}"
													id="preset_id" class="form-control form-control-sm">
													<option value=""></option>
													<option th:each="preset : ${PRESETS}" th:value="${preset.id}"
														th:data-low="${#numbers.formatDecimal(preset.bore_reamer_low, 1, 4)}"
														th:data-high="${#numbers.formatDecimal(preset.bore_reamer_high, 1, 4)}"
														th:text="${preset.caliber}"></option>
												</select>
											</div>
											<div class="col-md-4 mb-3">
												<label class="control-label" for="diameter_from">As Measured Low</label>
												<input type="number" step="0.0001" class="form-control form-control-sm"
													id="diameter_from" th:field="*{diameter_from}">
											</div>
											<div class="col-md-4 mb-3">
												<label class="control-label" for="diameter_to">As Measured High</label>
												<input type="number" step="0.0001" class="form-control form-control-sm"
													id="diameter_to" th:field="*{diameter_to}">
											</div>
										</div>


										<button type="submit" class="btn btn-primary btn-sm" >Search</button>

									</form>

								</div>

							</div>




							<div class="card card-fluid" style="margin-top: 25px;">
								<div class="card-header"><span class="h6 m-0 font-weight-bold text-primary">RESULTS</span></div>
								<!-- /.card-header -->

								<div class="card-body">
									<!-- .table -->

									<table class="table table-hover table-sm table-bordered"
										id="results">
										<thead>
											<tr>
												<th></th>
												<th>TOOL IDENTIFER</th>
												<th>STYLE</th>
												<th>FLUTES</th>
												<th>DIA AM</th>
												<th>Status</th>
												<th>DOS</th>
												<th>EOS</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="r: ${RESULTS}">
												<td><a th:href="@{'/tool/br/read'(id=${r.id})}" role="button" class="btn btn-sm btn-icon btn-secondary"><i class="far fa-edit"></i></a> 
												<td th:text="${r.tool_identifier}" />
												<td th:text="${r.style}" />
												<td th:text="${r.flute_count}" />
												<td th:text="${#numbers.formatDecimal(r.dia_am,1,4)}" />
												<td th:text="${r.status}" />
												<td th:text="${r.dos_str}" />
												<td th:text="${r.eos_str}" />
											</tr>
										</tbody>
									</table>


								</div>
								<!-- /.card-body -->
							</div>
							<!-- /.card -->


					</div>
							
						
				</div>
						<!-- /.page-section -->
					</div>
					<!-- /.page-inner -->
				</div>


			<div th:replace="~{fragments/footer}"></div>


			<!-- /.wrapper -->
		</main>
		<!-- /.app-main -->
	</div>
	<!-- /.app -->


	<!-- BEGIN BASE JS -->
	<script th:src="@{/assets/vendor/jquery/jquery.min.js}"></script>
	<script th:src="@{/assets/vendor/bootstrap/js/popper.min.js}"></script>
	<script th:src="@{/assets/vendor/bootstrap/js/bootstrap.min.js}"></script>
	<!-- END BASE JS -->
	<!-- BEGIN PLUGINS JS -->
	<script th:src="@{/assets/vendor/pace/pace.min.js}"></script>
	<script th:src="@{/assets/vendor/stacked-menu/stacked-menu.min.js}"></script>
	<script th:src="@{/assets/vendor/flatpickr/flatpickr.min.js}"></script>

	<!-- BEGIN THEME JS -->
	<script th:src="@{/assets/javascript/theme.min.js}"></script>
	<!-- END THEME JS -->

	<!-- Page level plugins -->
	<script th:src="@{/assets/vendor/datatables/jquery.dataTables.min.js}"></script>
	<script
		th:src="@{/assets/vendor/datatables/dataTables.bootstrap4.min.js}"></script>

	<!-- Page level plugins -->
	<script th:src="@{/assets/vendor/chart.js/Chart.min.js}"></script>



	<script>
		$('#preset_id').on('change', function() {
			var selected = $(this).find('option:selected');
			$('#diameter_from').val(selected.data('low') || '');
			$('#diameter_to').val(selected.data('high') || '');
		});
		
	    $(document).ready(function() {
	        $('#results').DataTable();
	    } );
	    
    </script>


</body>
</html>
